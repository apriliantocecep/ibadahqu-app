<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <title>Jadwal Ibadah</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <section id="view-main">
      <header class="top">
        <div class="top-text">
          <p class="loc" id="lokasi">—</p>
          <p class="date" id="tanggal"></p>
        </div>
        <button class="icon-btn" id="btn-settings" type="button" title="Pengaturan" aria-label="Pengaturan">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.6-2-3.4-2.4 1a7.6 7.6 0 0 0-1.7-1L15 3.5h-4l-.4 2.5a7.6 7.6 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.6a7.5 7.5 0 0 0 0 2l-2 1.6 2 3.4 2.4-1a7.6 7.6 0 0 0 1.7 1l.4 2.5h4l.4-2.5a7.6 7.6 0 0 0 1.7-1l2.4 1 2-3.4-2-1.6ZM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7Z" transform="translate(-1 0)"/></svg>
        </button>
      </header>

      <div class="countdown" id="countdown">
        <p class="cd-label" id="cd-label">Menghitung…</p>
        <p class="cd-time" id="cd-time">--:--:--</p>
        <p class="cd-at" id="cd-at"></p>
        <p class="cd-note" id="cd-note"></p>
        <div class="bar"><i id="cd-bar"></i></div>
        <button class="btn primary" id="btn-pip" type="button">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><rect x="2.5" y="4.5" width="19" height="15" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><rect x="12" y="11" width="7" height="6" rx="1" fill="currentColor"/></svg>
          Picture-in-Picture
        </button>
      </div>

      <ul class="list" id="list"></ul>
      <p class="source" id="sumber"></p>
    </section>

    <section id="view-settings" hidden>
      <header class="top">
        <button class="icon-btn" id="btn-back" type="button" aria-label="Kembali">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="loc grow">Pengaturan</p>
      </header>

      <h2>Lokasi</h2>
      <select id="kota"></select>
      <button class="btn" id="gps" type="button">Gunakan lokasi saya</button>
      <p class="muted small" id="gps-msg"></p>

      <h2>Notifikasi</h2>
      <label class="toggle"><input type="checkbox" id="notif" /> Saat masuk waktu salat</label>
      <label class="field">Pengingat <select id="pengingat"></select></label>

      <div class="h2-row"><h2>Koreksi waktu</h2><button class="link" id="reset" type="button">Reset</button></div>
      <div id="corr"></div>
      <p class="muted small">±1 menit per klik (maks. ±30), menyesuaikan jadwal masjid setempat.</p>
    </section>
    <script type="module" src="popup.js"></script>
  </body>
</html>
